name: RSS discovery

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Discovery mode
        required: true
        default: auto
        type: choice
        options: [auto, bootstrap, live]
  schedule:
    # Explicit UTC. Use off-peak minute offsets rather than :00/:15/:30/:45,
    # while keeping multiple pre-cutoff anchors to absorb GitHub scheduler delay.
    - cron: "23 22 * * *" # 06:23 Beijing early anchor on the following local date
    - cron: "7 1 * * *"   # 09:07 Beijing primary morning discovery
    - cron: "23 2 * * *"  # 10:23 Beijing pre-cutoff backup discovery
    - cron: "7 3 * * *"   # 11:07 Beijing final intended pre-cutoff discovery
    - cron: "37 8 * * *"  # 16:37 Beijing post-digest refresh
    - cron: "43 12 * * *" # 20:43 Beijing evening refresh

permissions:
  contents: write

concurrency:
  group: three-journals-state-writer
  cancel-in-progress: false
  queue: max

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      # Full pytest belongs to CI. Scheduled acquisition must not be blocked by
      # repository-state assertions that can evolve independently of runtime code.
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Discover RSS items
        id: discover
        env:
          DISCOVERY_MODE: ${{ github.event.inputs.mode || 'auto' }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule || '' }}
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO || vars.CROSSREF_MAILTO }}
        shell: bash
        run: |
          set +e
          python scripts/discover_v2.py \
            --mode "$DISCOVERY_MODE" \
            --trigger-type "$GITHUB_EVENT_NAME" \
            --schedule-expression "$SCHEDULE_EXPRESSION"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit state, scheduler health, and failure records
        run: |
          if [[ -z "$(git status --porcelain -- data public)" ]]; then
            echo "No state changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public
          git commit -m "chore: record RSS discovery $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Propagate discovery failure after persistence
        if: steps.discover.outputs.exit_code != '0'
        run: exit "${{ steps.discover.outputs.exit_code }}"
