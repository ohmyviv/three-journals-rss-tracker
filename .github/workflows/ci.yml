name: CI

on:
  push:
    paths:
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "config/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
