name: Retry metadata enrichment

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *" # 08:15 Beijing, explicit UTC

permissions:
  contents: write

concurrency:
  group: three-journals-state-writer
  cancel-in-progress: false
  queue: max

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: pytest -q
      - name: Retry empty Crossref abstracts
        id: enrichment
        env:
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO || vars.CROSSREF_MAILTO }}
        shell: bash
        run: |
          set +e
          python scripts/retry_crossref_enrichment.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit enrichment state
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ -z "$(git status --porcelain -- data public)" ]]; then
            echo "No enrichment changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public
          git commit -m "chore: retry delayed metadata enrichment $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
      - name: Propagate complete enrichment failure after persistence
        if: steps.enrichment.outputs.exit_code != '0'
        run: exit "${{ steps.enrichment.outputs.exit_code }}"
