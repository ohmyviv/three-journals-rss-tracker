name: Apply legacy backlog triage

on:
  workflow_dispatch:
    inputs:
      migration_file:
        description: "Path to a legacy deep-analysis migration JSON file"
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - "data/deep_analysis_migrations/*.json"

permissions:
  contents: write

concurrency:
  group: three-journals-state-writer
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Resolve migration file
        id: migration
        env:
          INPUT_MIGRATION_FILE: ${{ inputs.migration_file }}
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [[ -n "$INPUT_MIGRATION_FILE" ]]; then
            migration_file="$INPUT_MIGRATION_FILE"
          else
            migration_file="$(git diff-tree --no-commit-id --name-only -r "$EVENT_SHA" -- 'data/deep_analysis_migrations/*.json' | tail -n 1)"
          fi
          if [[ -z "$migration_file" || ! -f "$migration_file" ]]; then
            echo "Could not resolve a valid legacy migration file"
            exit 2
          fi
          echo "migration_file=$migration_file" >> "$GITHUB_OUTPUT"
      - name: Apply legacy backlog triage
        run: python scripts/apply_legacy_backlog_triage.py "${{ steps.migration.outputs.migration_file }}"
      - name: Commit triaged deep-analysis state
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ -z "$(git status --porcelain -- data/doi_index.json data/deep_analysis_queue.json data/deep_analysis_history.jsonl)" ]]; then
            echo "No legacy backlog state changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/doi_index.json data/deep_analysis_queue.json data/deep_analysis_history.jsonl
          git commit -m "chore: apply legacy backlog triage $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
